# /etc/ssh/ssh_config.d/50-nexus-key.conf inside a persona with an ssh key of its own: config.sh mounts
# this file, and the key at /run/nexus/ssh-key, both read-only, and no ssh-agent. Its ssh, and so git
# over ssh, use that key and no other.
IdentityFile /run/nexus/ssh-key
IdentitiesOnly yes
# No password prompt: a key the git host refuses fails at once, instead of waiting for a password.
BatchMode yes
