# /etc/tmux.conf inside the persona containers.
# Persona colour / status-left are set at runtime by the entrypoint.

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -g mouse on
set -g history-limit 100000
set -g escape-time 10
set -g focus-events on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g status-interval 5
setw -g window-status-current-style "bold,reverse"

# One session per project: when a session ends, hop to another instead of being dropped
# out of the container.
set -g detach-on-destroy off

# Shift+Left/Right = previous/next session = previous/next project.
bind -n S-Left  switch-client -p
bind -n S-Right switch-client -n
# Prefix+s is the interactive session picker (built in). Prefix+c = new window in this project.
